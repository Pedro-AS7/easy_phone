<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test sign-up</title>
<style>body { font: 18px sans-serif; margin: 24px; } input, button { font: inherit; display: block; width: 100%; padding: 12px; margin: 8px 0 20px; box-sizing: border-box; }</style>
<h1>Test sign-up</h1>
<form action="/enviar" method="get">
  <label for="email">E-mail</label>
  <input id="email" name="email" type="email" aria-label="E-mail" autocomplete="off">
  <label for="telefone">Phone</label>
  <input id="telefone" name="telefone" type="tel" aria-label="Phone" autocomplete="off">
  <button type="submit">Send</button>
</form>
</html>
